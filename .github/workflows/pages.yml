name: Test and deploy website

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"
  SITE_ORIGIN: https://floricaltd.github.io
  SITE_BASE_PATH: /floricaltd-static-website/

jobs:
  build:
    name: Build and verify site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      evidence-artifact-id: ${{ steps.evidence-upload.outputs.artifact-id }}
      evidence-artifact-digest: ${{ steps.evidence-upload.outputs.artifact-digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install hash-locked build dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-build.txt
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps .
      - name: Run unit, deterministic-build, link, fragment, and HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Scan tracked files, reachable history, and workflow controls
        run: python scripts/check_repository.py
      - name: Build project site
        run: florica-build
      - name: Create SBOM, provenance, and deterministic artifact
        run: python scripts/create_release_evidence.py --source-sha "$GITHUB_SHA" --source-ref "$GITHUB_REF"
      - name: Verify generated release evidence
        run: sha256sum --check SHA256SUMS
        working-directory: release
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist
      - name: Retain release evidence
        id: evidence-upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 90

  attest:
    name: Attest release artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence-${{ github.sha }}
          path: release
      - name: Verify retained digest
        run: sha256sum --check SHA256SUMS
        working-directory: release
      - name: Create GitHub build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release/site.tar

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, attest]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact tested Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
